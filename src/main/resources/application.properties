spring.application.name=fujitsu-task

# H2 database
spring.datasource.url=jdbc:h2:mem:fujitsudb
spring.datasource.username=${DB_USER:shrek}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

# Weather data import
weather.import.url=https://www.ilmateenistus.ee/ilma_andmed/xml/observations.php
weather.import.cron=0 15 * * * *
weather.import.on-startup=true

# Load initial fee rules from data.sql after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true

# API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
